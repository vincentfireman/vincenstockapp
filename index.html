
</body>
</html>
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 쉬운 브리핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF6FA;
    --card:#FFFFFF;
    --ink:#1F3D52;
    --muted:#6C8598;
    --line:#D9E9F1;
    --highlight:#BEE6F7;
    --highlight-dark:#3E9FCC;
    --accent:#3E9FCC;
    --warn:#D9694B;
    --warn-bg:#FBE7DE;
    --good:#2E8F72;
    --good-bg:#E1F3EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:460px;}
  .app-title{
    font-family:'Fraunces',serif;
    font-size:25px;
    font-weight:700;
    margin:4px 0 4px;
  }
  .app-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}

  .search-box{position:relative;margin-bottom:24px;}
  .search-box input{
    width:100%;
    padding:15px 18px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    outline:none;
    box-shadow:0 2px 10px -6px rgba(58,47,39,0.15);
  }
  .search-box input::placeholder{color:#8FA9BA;}
  .search-box input:focus{border-color:var(--highlight-dark);}
  .search-results{
    margin-top:10px;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 6px 20px -10px rgba(58,47,39,0.25);
  }
  .search-result-item{
    padding:14px 18px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14.5px;
  }
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:hover{background:var(--paper);}
  .search-result-empty{padding:16px 18px;font-size:13px;color:var(--muted);line-height:1.6;}

  .section-label{
    font-size:13px;
    font-weight:700;
    color:var(--muted);
    margin:24px 2px 12px;
    letter-spacing:0.02em;
  }
  .watchlist{display:flex;flex-direction:column;gap:12px;}
  .watch-card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:18px;
    padding:16px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    box-shadow:0 2px 10px -6px rgba(58,47,39,0.12);
    transition:transform .12s ease, border-color .12s ease;
  }
  .watch-card:hover{border-color:var(--highlight-dark);transform:translateY(-1px);}
  .watch-left .name{font-weight:700;font-size:16px;}
  .watch-left .ticker{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);margin-top:2px;}
  .watch-right{text-align:right;}
  .watch-price{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;}
  .watch-change{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;
    padding:3px 8px;border-radius:20px;display:inline-block;margin-top:4px;
  }
  .up{color:var(--good);background:var(--good-bg);}
  .down{color:var(--warn);background:var(--warn-bg);}

  .empty-state{
    text-align:center;padding:40px 22px;color:var(--muted);
    font-size:13.5px;line-height:1.7;background:var(--card);
    border:1.5px dashed var(--line);border-radius:18px;
  }

  .detail{display:none;}
  .detail.active{display:block;}
  .home{display:block;}
  .home.hidden{display:none;}

  .back-btn{
    display:inline-flex;align-items:center;gap:6px;background:none;border:none;
    color:var(--muted);font-size:13.5px;font-weight:600;font-family:'Inter',sans-serif;
    cursor:pointer;padding:8px 0;margin-bottom:8px;
  }
  .back-btn:hover{color:var(--ink);}

  .detail-card{
    background:var(--card);border:1.5px solid var(--line);border-radius:24px;
    overflow:hidden;box-shadow:0 8px 30px -14px rgba(58,47,39,0.3);
  }
  .detail-header{padding:24px 22px 20px;border-bottom:1px solid var(--line);}
  .ticker-row{display:flex;justify-content:space-between;align-items:baseline;}
  .ticker{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);font-weight:600;}
  .star-btn{background:none;border:none;cursor:pointer;font-size:22px;color:#C3D6E1;}
  .star-btn.active{color:var(--highlight-dark);}
  .company{font-family:'Fraunces',serif;font-size:26px;font-weight:700;margin:5px 0 12px;}
  .price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .price{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:700;}
  .change-badge{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;padding:4px 10px;border-radius:20px;}
  .asof{font-size:12px;color:var(--muted);margin-top:8px;}
  .oneliner{
    margin-top:18px;font-size:15px;line-height:1.65;
    background:var(--paper);border:1px solid var(--line);
    border-radius:16px;padding:16px 18px;
  }
  .oneliner b{background:linear-gradient(transparent 60%, var(--highlight) 60%);}

  .section{padding:22px;border-bottom:1px solid var(--line);}
  .section:last-child{border-bottom:none;}
  .section-title{
    font-family:'Fraunces',serif;font-size:18px;font-weight:700;margin:0 0 14px;
    display:flex;align-items:center;gap:8px;
  }

  .indicator{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line);}
  .indicator:last-child{border-bottom:none;}
  .ind-label{font-size:13px;color:var(--muted);min-width:76px;padding-top:2px;}
  .ind-body{flex:1;text-align:right;}
  .ind-value{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;}
  .ind-explain{font-size:12.5px;line-height:1.55;color:#6B5D4C;margin-top:5px;text-align:right;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;}
  .tag.good{background:var(--good-bg);color:var(--good);}
  .tag.warn{background:var(--warn-bg);color:var(--warn);}
  .tag.neutral{background:#E3EFF5;color:var(--muted);}

  .news-summary{font-size:14.5px;line-height:1.65;color:var(--ink);}
  .news-sources{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6;}
  .news-sources a{color:var(--accent);text-decoration:none;}
  .news-sources a:hover{text-decoration:underline;}
  .news-empty{font-size:13px;color:var(--muted);line-height:1.6;}

  .rec-box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;}
  .rec-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .rec-bar-row:last-child{margin-bottom:0;}
  .rec-label{width:78px;font-size:12.5px;color:var(--ink);font-weight:500;}
  .rec-track{flex:1;height:12px;background:#E3EFF5;border-radius:8px;overflow:hidden;}
  .rec-fill{height:100%;border-radius:8px;}
  .rec-count{width:26px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:700;}
  .rec-note{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px;}

  .disclaimer{
    margin-top:4px;padding:15px 17px;font-size:11px;color:var(--muted);
    line-height:1.7;background:var(--paper);border-radius:14px;
  }
</style>
</head>
<body>
<div class="app">

  <div class="home" id="homeScreen">
    <div class="app-title">주식 쉬운 브리핑</div>
    <div class="app-sub" id="updatedAt">데이터 불러오는 중...</div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="종목명이나 티커 검색 (예: 엔비디아, NVDA)">
      <div class="search-results" id="searchResults" style="display:none;"></div>
    </div>

    <div class="section-label">내 관심 종목</div>
    <div class="watchlist" id="watchlist"></div>
  </div>

  <div class="detail" id="detailScreen">
    <button class="back-btn" onclick="showHome()">← 목록으로</button>
    <div class="detail-card" id="detailContent"></div>
  </div>

</div>

<script>
let DATA = null;
let watchlist = JSON.parse(localStorage.getItem('watchlist') || '[]');

fetch('data.json')
  .then(r => r.json())
  .then(json => {
    DATA = json;
    document.getElementById('updatedAt').textContent = `${json.updated_at} 기준 브리핑`;
    renderWatchlist();
  })
  .catch(() => {
    document.getElementById('updatedAt').textContent = '데이터를 불러오지 못했어요. data.json 위치를 확인해주세요.';
  });

const COMPANY_NAMES = { NVDA: '엔비디아', INTC: '인텔' };

function saveWatchlist(){ localStorage.setItem('watchlist', JSON.stringify(watchlist)); }

function toggleWatch(symbol){
  if (watchlist.includes(symbol)) watchlist = watchlist.filter(s => s !== symbol);
  else watchlist.push(symbol);
  saveWatchlist();
  renderWatchlist();
}

function renderWatchlist(){
  const el = document.getElementById('watchlist');
  if (!DATA) return;

  if (watchlist.length === 0) {
    el.innerHTML = `<div class="empty-state">아직 즐겨찾기한 종목이 없어요.<br>위 검색창에서 종목을 찾아 추가해보세요.</div>`;
    return;
  }

  el.innerHTML = watchlist.map(symbol => {
    const s = DATA.stocks[symbol];
    if (!s) return '';
    const dir = s.change_pct >= 0 ? 'up' : 'down';
    const arrow = s.change_pct >= 0 ? '+' : '';
    return `
      <div class="watch-card" onclick="showDetail('${symbol}')">
        <div class="watch-left">
          <div class="name">${COMPANY_NAMES[symbol] || symbol}</div>
          <div class="ticker">${symbol}</div>
        </div>
        <div class="watch-right">
          <div class="watch-price">$${s.price?.toFixed(2)}</div>
          <div class="watch-change ${dir}">${arrow}${s.change_pct?.toFixed(2)}%</div>
        </div>
      </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const resultsEl = document.getElementById('searchResults');
  if (!q || !DATA) { resultsEl.style.display = 'none'; return; }

  const matches = Object.keys(DATA.stocks).filter(symbol => {
    const name = (COMPANY_NAMES[symbol] || '').toLowerCase();
    return symbol.toLowerCase().includes(q) || name.includes(q);
  });

  resultsEl.style.display = 'block';

  if (matches.length === 0) {
    resultsEl.innerHTML = `<div class="search-result-empty">"${e.target.value}"에 대한 샘플 데이터가 없어요.<br>지금은 엔비디아(NVDA), 인텔(INTC)만 제공돼요.</div>`;
    return;
  }

  resultsEl.innerHTML = matches.map(symbol => `
    <div class="search-result-item" onclick="showDetail('${symbol}')">
      <span>${COMPANY_NAMES[symbol] || symbol} <span style="color:var(--muted);font-size:12px;">${symbol}</span></span>
      <span style="font-size:12px;color:var(--muted);">${watchlist.includes(symbol) ? '★ 즐겨찾기됨' : '탭하여 보기'}</span>
    </div>`).join('');
});

function peTag(pe){
  if (!pe) return '';
  if (pe < 20) return '<span class="tag good">저렴한 편</span>';
  if (pe > 40) return '<span class="tag warn">비싼 편</span>';
  return '<span class="tag neutral">보통 수준</span>';
}

function positionTag(current, high, low){
  if (!current || !high || !low || high === low) return { text: '-', tag: '' };
  const pos = (current - low) / (high - low) * 100;
  let tag = '<span class="tag neutral">중간 구간</span>';
  if (pos < 35) tag = '<span class="tag good">저점권</span>';
  if (pos > 80) tag = '<span class="tag warn">고점권</span>';
  return { text: `최고가 대비 -${(100 - pos).toFixed(0)}%`, tag };
}

function renderNews(newsSummary, newsList){
  const summaryHtml = `<div class="news-summary">${newsSummary || '최근 뉴스 요약이 아직 없어요.'}</div>`;

  if (!newsList || newsList.length === 0) {
    return summaryHtml;
  }

  const sources = newsList.map(n =>
    `<a href="${n.url}" target="_blank" rel="noopener">${n.source || '기사'}</a>`
  ).join(' · ');

  return `${summaryHtml}<div class="news-sources">출처: ${sources}</div>`;
}

function renderRecommendation(rec){
  if (!rec) {
    return `<div class="rec-note">이 종목의 애널리스트 의견 데이터가 아직 없어요.</div>`;
  }
  const items = [
    { label: '적극 매수', value: rec.strongBuy, color: 'var(--good)' },
    { label: '매수', value: rec.buy, color: '#7FBFA0' },
    { label: '중립', value: rec.hold, color: '#C3D6E1' },
    { label: '매도', value: rec.sell, color: '#E8A98D' },
    { label: '적극 매도', value: rec.strongSell, color: 'var(--warn)' },
  ];
  const max = Math.max(...items.map(i => i.value || 0), 1);

  const bars = items.map(i => `
    <div class="rec-bar-row">
      <span class="rec-label">${i.label}</span>
      <div class="rec-track"><div class="rec-fill" style="width:${((i.value||0)/max*100)}%;background:${i.color};"></div></div>
      <span class="rec-count">${i.value ?? 0}</span>
    </div>`).join('');

  return `${bars}<div class="rec-note">월가 애널리스트들이 최근 이 종목에 대해 낸 의견을 그대로 보여드리는 거예요. 미래를 맞히는 예측이 아니라 "전문가들 생각이 이렇게 갈려있다"는 참고 자료로 봐주세요.</div>`;
}

function showDetail(symbol){
  const s = DATA.stocks[symbol];
  if (!s) return;

  const dir = s.change_pct >= 0 ? 'up' : 'down';
  const arrow = s.change_pct >= 0 ? '+' : '';
  const isWatched = watchlist.includes(symbol);
  const pos = positionTag(s.price, s.week52_high, s.week52_low);

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-header">
      <div class="ticker-row">
        <span class="ticker">NASDAQ · ${symbol}</span>
        <button class="star-btn ${isWatched ? 'active' : ''}" onclick="toggleWatch('${symbol}'); showDetail('${symbol}')">${isWatched ? '★' : '☆'}</button>
      </div>
      <div class="company">${COMPANY_NAMES[symbol] || symbol}</div>
      <div class="price-row">
        <span class="price">$${s.price?.toFixed(2)}</span>
        <span class="change-badge ${dir === 'up' ? 'up' : 'down'}">${arrow}${s.change_pct?.toFixed(2)}%</span>
      </div>
      <div class="asof">${DATA.updated_at} 종가 기준</div>
      <div class="oneliner">${s.easy_explanation || '아직 설명이 준비되지 않았어요.'}</div>
    </div>

    <div class="section">
      <div class="section-title">📊 지금 이 가격, 싼 걸까요?</div>
      <div class="indicator">
        <span class="ind-label">주가 위치</span>
        <div class="ind-body">
          <div class="ind-value">${pos.text}${pos.tag}</div>
          <div class="ind-explain">1년 중 가장 비쌌을 때와 가장 쌌을 때 사이에서 지금이 어디쯤인지 보여줘요.</div>
        </div>
      </div>
      <div class="indicator">
        <span class="ind-label">PER</span>
        <div class="ind-body">
          <div class="ind-value">${s.pe_ttm ? s.pe_ttm.toFixed(1) + '배' : '-'}${peTag(s.pe_ttm)}</div>
          <div class="ind-explain">${s.pe_ttm ? `이 회사가 1년에 버는 돈의 ${s.pe_ttm.toFixed(0)}배 가격에 거래되고 있다는 뜻이에요.` : '데이터가 아직 없어요.'}</div>
        </div>
      </div>
      <div class="indicator">
        <span class="ind-label">52주 최고</span>
        <div class="ind-body">
          <div class="ind-value">$${s.week52_high?.toFixed(2) ?? '-'}</div>
          <div class="ind-explain">최근 1년 중 가장 비쌌던 가격이에요.</div>
        </div>
      </div>
      <div class="indicator">
        <span class="ind-label">52주 최저</span>
        <div class="ind-body">
          <div class="ind-value">$${s.week52_low?.toFixed(2) ?? '-'}</div>
          <div class="ind-explain">최근 1년 중 가장 쌌던 가격이에요.</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📰 요즘 무슨 일이 있었나요?</div>
      ${renderNews(s.news_summary, s.news)}
    </div>

    <div class="section">
      <div class="section-title">🎯 전문가들은 어떻게 볼까요?</div>
      <div class="rec-box">${renderRecommendation(s.recommendation)}</div>
    </div>

    <div class="section">
      <div class="disclaimer">이 화면은 정보 정리 도구이며 투자 조언이나 매수·매도 권유가 아닙니다. 투자 판단과 그 책임은 본인에게 있습니다.</div>
    </div>
  `;

  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('detailScreen').classList.add('active');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').style.display = 'none';
}

function showHome(){
  document.getElementById('homeScreen').classList.remove('hidden');
  document.getElementById('detailScreen').classList.remove('active');
  renderWatchlist();
}
</script>
</body>
</html>
